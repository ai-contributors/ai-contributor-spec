# Dependabot keeps the scaffold's dependencies on a known cadence so a fresh
# adopter does not silently drift from the audited baseline. Required for
# Pillar 4 §16 `AIC-automated-dep-updates` Fulfilled status.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
